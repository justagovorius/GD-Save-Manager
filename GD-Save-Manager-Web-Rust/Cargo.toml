[package]
name = "gd-save-manager-web"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
dirs = "5.0"
chrono = "0.4"
webbrowser = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true